<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f4f5f8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="53"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-email"
        class="scene"
        data-composition-id="02-email"
        data-composition-src="compositions/frames/02-email.html"
        data-start="5"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-research"
        class="scene"
        data-composition-id="03-research"
        data-composition-src="compositions/frames/03-research.html"
        data-start="11"
        data-duration="9.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-draft"
        class="scene"
        data-composition-id="04-draft"
        data-composition-src="compositions/frames/04-draft.html"
        data-start="20"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-05-emergency"
        class="scene"
        data-composition-id="05-emergency"
        data-composition-src="compositions/frames/05-emergency.html"
        data-start="27"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-approve"
        class="scene"
        data-composition-id="06-approve"
        data-composition-src="compositions/frames/06-approve.html"
        data-start="35"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-proof"
        class="scene"
        data-composition-id="07-proof"
        data-composition-src="compositions/frames/07-proof.html"
        data-start="41"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="47"
        data-duration="6"
        data-track-index="1"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/track.wav"
        data-start="0"
        data-duration="53"
        data-track-index="20"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-email", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-02-email", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.fromTo("#el-03-research", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 11);
        tl.to("#el-03-research", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-04-draft", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.to("#el-05-emergency", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.fromTo("#el-06-approve", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.to("#el-06-approve", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 41);
        tl.fromTo("#el-07-proof", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 41);
        tl.to("#el-07-proof", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 47);
        tl.to({}, { duration: 53 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
