function typeOn(tl, el, text, at, dur, caret) {
  const state = { n: 0 };

    tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
    tl.to(caret, { opacity: 0, duration: 0.2 }, at + dur + 0.3);
  }
